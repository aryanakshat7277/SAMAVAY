# Spring Boot Configuration for SAMAVAY Digital Public Infrastructure
spring.application.name=samavay
server.port=8080

# Database Configuration (H2 Default with Web Console for Phase 1 Demo & Testing)
spring.datasource.url=jdbc:h2:mem:samavaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security JWT
samavay.jwt.secret=9a6747f3a73c7dc1eef6e21f3f8235b1f4166feb86cf5a300193d1ee4a5e255f
samavay.jwt.expiration-ms=86400000

# CORS Configuration
samavay.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
